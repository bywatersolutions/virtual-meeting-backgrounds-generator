<svg width="1440" height="1080" viewBox="0 0 1440 1080" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <!--
    4:3 (1440x1080) "Original Ratio" copy of foreground-light-bottom.svg: transparent
    foreground overlay, dark ink + black logo, for LIGHTER real backgrounds.
    Only the canvas width and the right-aligned logo x differ. See foreground-light-bottom.svg
    for the full notes.
  -->
  <defs>
    <filter id="halo" x="-10%" y="-40%" width="120%" height="180%" color-interpolation-filters="sRGB">
      <!-- Outline: blur the ink's shape, then steepen the alpha so it becomes a thin, round-cornered rim -->
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feComponentTransfer result="rim"><feFuncA type="linear" slope="7" intercept="-0.5"/></feComponentTransfer>
      <feFlood flood-color="#FFFFFF" flood-opacity="0.9"/>
      <feComposite in2="rim" operator="in" result="outline"/>
      <!-- Glow: a wide, faint blur of the same shape -->
      <feGaussianBlur in="SourceAlpha" stdDeviation="9"/>
      <feComponentTransfer result="wide"><feFuncA type="linear" slope="1.6"/></feComponentTransfer>
      <feFlood flood-color="#FFFFFF" flood-opacity="0.55"/>
      <feComposite in2="wide" operator="in" result="glow"/>
      <feMerge><feMergeNode in="glow"/><feMergeNode in="outline"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g filter="url(#halo)">
    <!-- Lower-left: name + title (shifted up by the height of any wrapped title lines) -->
    <g transform="translate(-12,-203.6) scale(1.2) translate(0,-{{TITLE_EXTRA_HEIGHT}})">
    <g font-family="'Helvetica Neue', Arial, sans-serif">
      <rect x="60" y="900" width="8" height="{{TITLE_EXTRA_HEIGHT+118}}" rx="4" fill="#1C4A74"/>
      <text x="96" y="962" font-size="68" font-weight="700" fill="#0B1F33" letter-spacing="0.5">{{NAME}}</text>
      <text x="98" y="1010" font-size="30" font-weight="400" fill="#0B1F33" opacity="0.85" letter-spacing="2.5">{{TITLE_UPPER}}</text>
    </g>
    </g>

    <!-- Lower-right: black logo (right-aligned to the narrower 4:3 canvas) -->
    <image x="1016" y="869.8" width="360" height="114.2" xlink:href="{{LOGO_BLACK}}" href="{{LOGO_BLACK}}"/>
  </g>
</svg>
